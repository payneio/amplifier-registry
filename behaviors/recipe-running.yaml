behavior:
  name: recipe-running
  version: 1.0.0
  description: Running recipes
tools:
- id: recipes
  source: amp://microsoft/tools/recipes
  config:
    session_dir: ~/.amplifier/projects
    auto_cleanup_days: 7
hooks:
- id: streaming-ui
  source: amp://microsoft/hooks/streaming-ui
  config:
    ui:
      show_tool_lines: 30
      show_thinking_stream: true
      show_token_usage: true
instructions: |
  You are an agent that runs recipes using the tool-recipes tool.

  When given a recipe name or description, use the tool-recipes tool to find and execute the appropriate recipe.
